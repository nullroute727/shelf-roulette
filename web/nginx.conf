# Shelf Roulette - static web tier.
# Drop-in for /etc/nginx/conf.d/default.conf (included from the stock http block).
#
# Serves the canvas-wheel frontend from /usr/share/nginx/html and reverse-proxies
# /api/* to the FastAPI container reachable as `proxy:8000` on the internal
# docker network, so the browser only ever talks to this origin.

# Cache-Control is driven from one map so that no location needs its own
# add_header. Any add_header inside a location would drop the server-level
# security headers (nginx headers module does not merge, it replaces), so
# keeping every add_header at server level is what makes the headers universal.
# First matching regex wins, so the /fonts/*.css exception is listed first.
map $uri $shelf_cache_control {
    default                      "no-cache";
    ~^/fonts/.+\.css$            "no-cache";
    ~^/fonts/                    "public, max-age=31536000, immutable";
    ~^/icons/                    "public, max-age=31536000, immutable";
    # Let the backend own caching semantics for its own responses.
    ~^/api/                      "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Host port may differ from 8080, so never emit absolute redirects.
    absolute_redirect off;

    # Docker embedded DNS. Required so that the variable proxy_pass below is
    # resolved at request time instead of at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    # text/html is always gzipped. woff2 and png are pre-compressed, so they
    # are deliberately absent here.
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # LAN app security headers. Inherited by every location because no location
    # declares an add_header of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control $shelf_cache_control always;

    # Container healthcheck. Never depends on the proxy being reachable.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API. The upstream host is held in a variable on purpose:
    # a literal `proxy_pass http://proxy:8000` is resolved at startup and nginx
    # aborts with "host not found in upstream" whenever the proxy container is
    # not up yet. With a variable plus the resolver above, nginx starts fine and
    # simply answers 502 until the backend appears.
    # Variable form does not forward the request URI implicitly, hence the
    # explicit $request_uri (which carries the original path and query string).
    location /api/ {
        set $api_upstream http://proxy:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold shelf fetch paginates Goodreads and can take several seconds.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No proxy caching here, the backend already caches.
        proxy_redirect off;
    }

    # alpine mime.types does not know .webmanifest. `types { }` resets the map
    # for this location so default_type is the single Content-Type emitted.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Redeploys on this LAN must be picked up immediately, so the app shell is
    # revalidated every load (Cache-Control comes from the map default).
    location = /index.html { }
    location = /styles.css { }
    location = /app.js     { }

    # Vendored fonts and generated icons are versionless but effectively frozen.
    location /fonts/ { }
    location /icons/ { }

    location / {
        try_files $uri $uri/ =404;
    }
}
